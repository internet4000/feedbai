#cloud-config
# feedbai box: first boot of a fresh Debian (12 or newer), on any provider or machine. Holds no secrets:
# user data can be read back. Checked by deploy/check.sh. Reusing it? Put your own agent's key below.

users:
  - name: ops # the agent's login: key-only. Prototype only: sudo (remove it, then SSH, before production)
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMVeWZudlObKFVaK6S649KTdPnoNqJLWIq2Cy26TH5SF feedbai-ops (agent, prototype box only) 2026-11-08
  - name: runner # runs the jobs, in rootless containers; no login
    homedir: /var/lib/feedbai
    shell: /usr/sbin/nologin

package_update: true
package_upgrade: true
packages: [podman, uidmap, passt, slirp4netns, unattended-upgrades]

write_files:
  - path: /etc/ssh/sshd_config.d/10-feedbai.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers ops
      AllowTcpForwarding no
      AllowAgentForwarding no
      X11Forwarding no
  - path: /etc/apt/apt.conf.d/52feedbai
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
  - path: /etc/systemd/journald.conf.d/10-feedbai.conf
    content: | # short logs: enough to debug, not an archive of anyone's activity
      [Journal]
      SystemMaxUse=200M
      MaxRetentionSec=14day
  - path: /etc/sysctl.d/90-feedbai.conf
    content: | # containers can't read kernel addresses or logs, nor load BPF
      kernel.kptr_restrict = 2
      kernel.dmesg_restrict = 1
      kernel.unprivileged_bpf_disabled = 1
      net.core.bpf_jit_harden = 2

runcmd:
  - rm -f /root/.ssh/authorized_keys # root has no way in: no keys (a provider may add one),
  - passwd -l root # and no password (some providers set one)
  - systemctl restart ssh
  - sysctl --system
  - systemctl restart systemd-journald
  - loginctl enable-linger runner # its services run without anyone logged in
  - touch /var/lib/cloud/feedbai-ready
