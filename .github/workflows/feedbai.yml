# Hourly: file new #feedbai feedback that mentions the bot as GitHub issues (label: feedback).
# Secrets: FEEDBAI_MATRIX_TOKEN, FEEDBAI_MATRIX_USER (e.g. @bot:matrix.org). Skipped without them:
# with the hosted hub (feedbai GitHub App installed), the hub files the issues instead.
# In other projects, replace `node src/cli.js` with `npx -y @internet4000/feedbai`.
name: feedbai
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  issues:
    runs-on: ubuntu-latest
    env:
      FEEDBAI_MATRIX_TOKEN: ${{ secrets.FEEDBAI_MATRIX_TOKEN }}
      FEEDBAI_MATRIX_USER: ${{ secrets.FEEDBAI_MATRIX_USER }}
    steps:
      - if: env.FEEDBAI_MATRIX_TOKEN == ''
        run: echo "::notice::No FEEDBAI_MATRIX_TOKEN secret, skipping. The feedbai hub files issues for repos with its GitHub App."
      - if: env.FEEDBAI_MATRIX_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.FEEDBAI_MATRIX_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - if: env.FEEDBAI_MATRIX_TOKEN != ''
        run: node src/cli.js issues --since 2h
        env:
          GH_TOKEN: ${{ github.token }}
