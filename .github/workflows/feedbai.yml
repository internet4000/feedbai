# Hourly: file feedback that mentions your bot as GitHub issues (label: feedback). No hub, no App:
# your bot's accounts + this workflow's own token. Guide: docs/on-your-own.md
# Secrets: FEEDBAI_MATRIX_TOKEN, FEEDBAI_MATRIX_USER (e.g. @bot:matrix.org); optional
# FEEDBAI_BLUESKY_IDENTIFIER, FEEDBAI_BLUESKY_PASSWORD. Skipped without a Matrix token.
# Copying it to your project: replace `node src/cli.js` with `npx -y @internet4000/feedbai`.
name: feedbai
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  issues:
    runs-on: ubuntu-latest
    env:
      FEEDBAI_MATRIX_TOKEN: ${{ secrets.FEEDBAI_MATRIX_TOKEN }}
      FEEDBAI_MATRIX_USER: ${{ secrets.FEEDBAI_MATRIX_USER }}
      FEEDBAI_BLUESKY_IDENTIFIER: ${{ secrets.FEEDBAI_BLUESKY_IDENTIFIER }}
      FEEDBAI_BLUESKY_PASSWORD: ${{ secrets.FEEDBAI_BLUESKY_PASSWORD }}
      FEEDBAI_HUB: "off" # read only with these accounts, never through a hub
    steps:
      - if: env.FEEDBAI_MATRIX_TOKEN == ''
        run: echo "::notice::No FEEDBAI_MATRIX_TOKEN secret, skipping (see docs/on-your-own.md). Repos with the feedbai GitHub App get issues from the hub instead."
      - if: env.FEEDBAI_MATRIX_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.FEEDBAI_MATRIX_TOKEN != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - if: env.FEEDBAI_MATRIX_TOKEN != ''
        run: node src/cli.js issues --since 2h
        env:
          GH_TOKEN: ${{ github.token }}

