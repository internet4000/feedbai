# Hourly: file new #feedbai feedback that mentions the bot as GitHub issues (label: feedback).
# Secrets: FEEDBAI_MATRIX_TOKEN, FEEDBAI_MATRIX_USER (e.g. @bot:matrix.org): the project's bot.
# GitHub access is the workflow's own token; no App or hosted service needed.
# In other projects, replace `node src/cli.js` with `npx -y @internet4000/feedbai`.
name: feedbai
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  issues:
    runs-on: ubuntu-latest
    env:
      FEEDBAI_MATRIX_TOKEN: ${{ secrets.FEEDBAI_MATRIX_TOKEN }}
      FEEDBAI_MATRIX_USER: ${{ secrets.FEEDBAI_MATRIX_USER }}
    steps:
      - if: env.FEEDBAI_MATRIX_TOKEN == ''
        run: echo "::warning::No FEEDBAI_MATRIX_TOKEN secret: nothing is filed. Add the project bot's token and user as repository secrets."
      - if: env.FEEDBAI_MATRIX_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.FEEDBAI_MATRIX_TOKEN != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - if: env.FEEDBAI_MATRIX_TOKEN != ''
        run: node src/cli.js issues --since 2h
        env:
          GH_TOKEN: ${{ github.token }}
