# feedbai hub: files feedback issues for every repo that installed the feedbai GitHub App.
# Off until the repository variable FEEDBAI_HUB_ENABLED is "true" (needs the secrets below).
name: feedbai hub
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feedbai-hub
  cancel-in-progress: false
jobs:
  hub:
    if: vars.FEEDBAI_HUB_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - run: node hub/run.js
        env:
          FEEDBAI_APP_ID: ${{ secrets.FEEDBAI_APP_ID }}
          FEEDBAI_APP_PRIVATE_KEY: ${{ secrets.FEEDBAI_APP_PRIVATE_KEY }}
          FEEDBAI_MATRIX_TOKEN: ${{ secrets.FEEDBAI_HUB_MATRIX_TOKEN }}
          FEEDBAI_MATRIX_USER: ${{ secrets.FEEDBAI_HUB_MATRIX_USER }}
