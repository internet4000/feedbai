# internet4000's hosted hub only (not part of the template in feedbai.yml).
name: hub health
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  # The hosted hub (feedbai.internet4000.com) is a convenience others rely on: when it stops
  # answering, open one issue (and close it when it's back), so an outage is never silent.
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HUB: https://feedbai.internet4000.com
      TITLE: "feedbai hub is down"
    steps:
      - run: |
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          # Liveness and the Matrix bot's token: read the project's own public room through the hub
          if curl -fsS -m 30 -o /dev/null "$HUB/v1/matrix?room=%23feedbai%3Amatrix.org&limit=1"; then
            [ -n "$open" ] && gh issue close "$open" --comment "Back up: $HUB answers again ($(date -u +%FT%TZ))."
            exit 0
          fi
          reason=$(curl -sS -m 30 "$HUB/v1/matrix?room=%23feedbai%3Amatrix.org&limit=1" 2>&1 | head -c 300)
          if [ -z "$open" ]; then
            printf '%s\n' "The hub at $HUB does not answer (hourly check in the \`feedbai\` workflow, $(date -u +%FT%TZ))." "" '```' "$reason" '```' "" \
              "Until it's back, people without accounts can't read Matrix rooms or Bluesky searches through it, and repos with the feedbai GitHub App get no issues filed. Redeploy: hub/README.md." > body.md
            gh issue create --title "$TITLE" --body-file body.md
          fi
          exit 1
