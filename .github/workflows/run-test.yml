name: Run tests
# Pull requests (from forks too) and main; not every branch push twice
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # The CLI's oldest supported Node (package.json engines) and the current LTS
    strategy:
      matrix:
        node: ["22", "lts/*"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
  site:
    # The website and docs (site/): builds, and fails on any broken link or #anchor between pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
      - run: npm ci --prefix site
      - run: npm run build --prefix site
