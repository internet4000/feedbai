# The project's agent in the loop (docs/architecture.md), every hour, in three jobs with different powers:
#   read   — reads the channels; no model, can't write to GitHub
#   triage — a model, sees the messages; only the model's key, can't write anything
#   act    — files issues and reacts ✅ from the checked plan (plain code); no model
# Each job is a separate, throwaway machine: the one that reads strangers' messages with a model can't act,
# and the ones that act never run a model.
#
# No secrets for GitHub or Matrix: GitHub gives the token for issues, and read and act prove to the feedbai hub
# which repository they are (OIDC, `id-token: write`), so its bot reads the room and ✅s for this repo.
# The model: any OpenAI-compatible API (OpenRouter, a local model, a provider), from repository variables
# FEEDBAI_TRIAGE_ENDPOINT and FEEDBAI_TRIAGE_MODEL and the secret FEEDBAI_TRIAGE_KEY. Without them, nothing
# is filed (triage in an agent session instead: `feedbai`, then `feedbai file`).
# The room's admins tie it to the repo by putting github.com/owner/name in the room topic.
# Set `"filing": "agent"` in feedbai.config.json so the hub stops copying mentions into issues.
# Copying it to your project: replace `node src/cli.js` with `npx -y @internet4000/feedbai`.
name: feedbai agent
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "How far back to read (e.g. 70m, 2d)"
        default: "70m"
      dry_run:
        description: "Stop after triage: read the plan, file nothing"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: feedbai-agent
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # proves to the hub which repository is reading
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # New feedback of the last 70 minutes (runs overlap; filing is idempotent). Exit code 2 means some
      # sources failed (listed in the log and in feedback.json): the others still go on to triage.
      - env:
          SINCE: ${{ inputs.since }}
        run: |
          set +e
          node src/cli.js fetch --format json --since "${SINCE:-70m}" > feedback.json
          code=$?
          [ "$code" -le 2 ] || exit "$code"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feedback
          path: feedback.json
          retention-days: 1

  triage:
    needs: read
    runs-on: ubuntu-latest
    # Only the model's key in this job, and a token that can read the repo, nothing else.
    permissions:
      contents: read
    env:
      FEEDBAI_TRIAGE_ENDPOINT: ${{ vars.FEEDBAI_TRIAGE_ENDPOINT }}
      FEEDBAI_TRIAGE_MODEL: ${{ vars.FEEDBAI_TRIAGE_MODEL }}
      FEEDBAI_TRIAGE_KEY: ${{ secrets.FEEDBAI_TRIAGE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feedback
      - run: |
          node src/cli.js triage --input feedback.json > plan.json
          cat plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: plan.json
          retention-days: 7

  act:
    needs: triage
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # No model in this job: plain code files the issues and reacts ✅, from the checked plan
    permissions:
      contents: read
      issues: write
      id-token: write # proves to the hub which repository asks for ✅
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
      - run: node src/cli.js triage --apply plan.json
