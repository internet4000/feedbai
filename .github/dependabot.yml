# Keeps the SHA-pinned actions in .github/workflows and the website's dependencies (site/) up to date.
# The feedbai CLI itself has no npm dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
